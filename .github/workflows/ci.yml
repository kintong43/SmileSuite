name: Integration checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-bookworm
        env:
          POSTGRES_DB: smilesuite_testing
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-synthetic-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d smilesuite_testing"
          --health-interval 10s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4-bookworm
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: testing
      APP_DEBUG: "false"
      APP_KEY: base64:MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      APP_URL: http://smilesuite.localhost
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: smilesuite_testing
      DB_USERNAME: postgres
      DB_PASSWORD: ci-synthetic-only
      DB_URL: ""
      REDIS_CLIENT: predis
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      SMILESUITE_SANDBOX: "true"
      LIVE_BILLING_ENABLED: "false"
      LIVE_COMMERCE_ENABLED: "false"
      REAL_PATIENT_DATA_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, intl, mbstring, zip, bcmath, pcntl
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: composer install --prefer-dist --no-interaction
      - run: npm ci
      - run: npm run build
      - run: php artisan migrate --env=testing --force
      - run: php artisan test --compact
