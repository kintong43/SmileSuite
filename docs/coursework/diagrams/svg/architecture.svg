<svg xmlns="http://www.w3.org/2000/svg" width="864" height="770" viewBox="0 0 864 770" role="img" aria-label="System architecture"><rect width="864" height="770" fill="white"/><style>text{font-family:Arial,sans-serif;fill:#222} .small{font-size:13px} .body{font-size:16px} .heading{font-size:25px;font-weight:700} .line{fill:none;stroke:#444;stroke-width:1.6}</style><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#444" stroke-width="1.2"/></marker></defs><text x="32" y="40" class="heading">System architecture</text><text x="32" y="65" class="small">Local baseline and integration boundaries · no browser database access</text><rect x="32" y="112" width="800" height="65" rx="4" fill="#f3f3f3" stroke="#444" stroke-width="1.6"/><text x="432" y="140" class="body" text-anchor="middle">Browser · Blade / Tailwind / Alpine</text><rect x="32" y="235" width="390" height="120" rx="4" fill="#f3f3f3" stroke="#444" stroke-width="1.6"/><text x="227" y="263" class="body" text-anchor="middle">Laravel 13 · PHP 8.4</text><text x="227" y="285" class="body" text-anchor="middle">Host → tenant context → auth / MFA</text><text x="227" y="307" class="body" text-anchor="middle">Policies → domain services</text><rect x="482" y="235" width="350" height="120" rx="4" fill="#f3f3f3" stroke="#444" stroke-width="1.6"/><text x="657" y="263" class="body" text-anchor="middle">Directus 11.17.4</text><text x="657" y="285" class="body" text-anchor="middle">Separate CMS login / permissions</text><text x="657" y="307" class="body" text-anchor="middle">Content API; local proof recorded separately</text><rect x="32" y="428" width="390" height="100" rx="4" fill="#f3f3f3" stroke="#444" stroke-width="1.6"/><text x="227" y="456" class="body" text-anchor="middle">PostgreSQL 16.15 · smilesuite</text><text x="227" y="478" class="body" text-anchor="middle">Clinic / scheduling / clinical records</text><text x="227" y="500" class="body" text-anchor="middle">Sessions: file · cache: file locally</text><rect x="482" y="428" width="350" height="100" rx="4" fill="#f3f3f3" stroke="#444" stroke-width="1.6"/><text x="657" y="456" class="body" text-anchor="middle">PostgreSQL · separate CMS database</text><text x="657" y="478" class="body" text-anchor="middle">Pages / announcements / services</text><text x="657" y="500" class="body" text-anchor="middle">Minimal staff / aggregate reports</text><rect x="32" y="612" width="390" height="85" rx="4" fill="#f3f3f3" stroke="#444" stroke-width="1.6"/><text x="227" y="640" class="body" text-anchor="middle">Queue + transactional outbox</text><text x="227" y="662" class="body" text-anchor="middle">Database queue locally; mail log</text><rect x="482" y="612" width="350" height="85" rx="4" fill="#f3f3f3" stroke="#444" stroke-width="1.6"/><text x="657" y="640" class="body" text-anchor="middle">Stripe / Shopify / email</text><text x="657" y="662" class="body" text-anchor="middle">Live billing / commerce disabled</text><polyline points="225,177 225,235" class="line" marker-end="url(#arrow)"/><rect x="237" y="193" width="213.89999999999998" height="21" fill="white"/><text x="240" y="208" class="small" text-anchor="start">HTTP local / HTTPS deployment</text><polyline points="422,285 482,285" class="line" marker-end="url(#arrow)"/><rect x="424" y="255" width="79" height="21" fill="white"/><text x="427" y="270" class="small" text-anchor="start">Server API</text><polyline points="225,355 225,428" class="line" marker-end="url(#arrow)"/><rect x="52" y="380" width="178.39999999999998" height="21" fill="white"/><text x="55" y="395" class="small" text-anchor="start">PDO / tenant constraints</text><polyline points="657,355 657,428" class="line" marker-end="url(#arrow)"/><rect x="664" y="380" width="79" height="21" fill="white"/><text x="667" y="395" class="small" text-anchor="start">PostgreSQL</text><polyline points="125,528 125,612" class="line" marker-end="url(#arrow)"/><rect x="137" y="558" width="79" height="21" fill="white"/><text x="140" y="573" class="small" text-anchor="start">Outbox IDs</text><polyline points="422,657 482,657" class="line" marker-end="url(#arrow)"/><rect x="427" y="625" width="135.8" height="21" fill="white"/><text x="430" y="640" class="small" text-anchor="start">Delivery transport</text><text x="32" y="737" class="small" text-anchor="start">Patient records stay in Laravel. Browser never connects to either database. Redis is a deployment option.</text></svg>